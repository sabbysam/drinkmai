<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.62  0 0 0 0 0.48  0 0 0 0.25 0" in="n"/>
    </filter>
    <linearGradient id="lift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa38a" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8fa38a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6f8a6c" stop-opacity="0.42"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" fill="url(#lift)"/>
  <g filter="url(#soft)" fill="#7d9678" opacity="0.42">
    <ellipse cx="180" cy="360" rx="420" ry="150"/>
    <ellipse cx="520" cy="390" rx="340" ry="130"/>
    <ellipse cx="860" cy="350" rx="390" ry="160"/>
    <ellipse cx="1220" cy="380" rx="320" ry="140"/>
  </g>
  <rect width="1440" height="420" filter="url(#grain)" opacity="0.18"/>
</svg>
