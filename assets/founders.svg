      <rect x="116" y="152" width="80" height="178" rx="14" fill="#f7f3eb" stroke-width="7"/>
      <ellipse cx="156" cy="152" rx="40" ry="11" fill="#f3eee5" stroke-width="7"/>
      <path d="M128 174 h56" stroke-width="3" opacity="0.4"/>
      <circle cx="156" cy="222" r="13" fill="#e8b494" stroke="none"/>
    </g>
    <g>
      <rect x="204" y="166" width="80" height="178" rx="14" fill="#f7f3eb" stroke-width="7"/>
      <ellipse cx="244" cy="166" rx="40" ry="11" fill="#f3eee5" stroke-width="7"/>
      <path d="M216 188 h56" stroke-width="3" opacity="0.4"/>
      <circle cx="244" cy="236" r="13" fill="#e8b494" stroke="none"/>
    </g>
  </g>
