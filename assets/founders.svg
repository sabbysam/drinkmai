<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" role="img" aria-labelledby="founders-title">
  <title id="founders-title">Two cans standing together in front of a peach sun</title>
  <defs>
    <radialGradient id="peach-sun" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#f3c6a8"/>
      <stop offset="40%" stop-color="#e8b494"/>
      <stop offset="100%" stop-color="#d49278"/>
    </radialGradient>
    <radialGradient id="peach-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b494" stop-opacity="0.4"/>
      <stop offset="72%" stop-color="#e8b494" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e8b494" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="198" r="168" fill="url(#peach-halo)"/>
  <circle cx="200" cy="176" r="118" fill="url(#peach-sun)"/>
  <circle cx="200" cy="68" r="11" fill="#e8b494"/>

  <ellipse cx="200" cy="348" rx="98" ry="16" fill="#1f4a35" opacity="0.08"/>

  <g stroke="#1f4a35" stroke-linejoin="round" stroke-linecap="round">
